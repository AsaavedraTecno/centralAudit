<!-- Barra superior estilo app -->
<div class="topbar">
  <div class="topbar-content">
    <div class="left-group">
      <div class="brand">
        <img [src]="logoUrl" alt="Logo" class="logo" [class.hidden]="!logoUrl" (error)="logoUrl=''" />
      </div>
    </div>

    <button (click)="logout()" class="btn btn-topbar ms-auto">
      <i class="fas fa-sign-out-alt me-1"></i>
      Cerrar sesión
    </button>
  </div>
  
  <!-- Menú de pestañas -->
  <div class="tab-menu">
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'clientes'"
      (click)="switchTab('clientes')">
      <i class="fas fa-users me-2"></i>
      Panel
    </button>
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'sucursales'"
      (click)="switchTab('sucursales')">
      <i class="fas fa-building me-2"></i>
      Crear Sucursales
    </button>
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'impresoras'"
      (click)="switchTab('impresoras')">
      <i class="fas fa-print me-2"></i>
      Impresoras
    </button>
    <button 
      *ngIf="isSuperAdmin()"
      class="tab-button" 
      [class.active]="activeTab === 'gestion'"
      (click)="switchTab('gestion')">
      <i class="fas fa-cogs me-2"></i>
      Gestión Clientes
    </button>
  </div>
</div>

<!-- Contenido a ancho completo -->
<div class="content-full">
  <!-- Pestaña de Clientes -->
  <div *ngIf="activeTab === 'clientes'">
    <app-cliente-tree></app-cliente-tree>
  </div>
  
  <!-- Pestaña de Sucursales -->
  <div *ngIf="activeTab === 'sucursales'">
    <app-sucursales></app-sucursales>
  </div>

  <!-- Pestaña de Impresoras -->
  <div *ngIf="activeTab === 'impresoras'">
    <app-impresoras></app-impresoras>
  </div>

  <!-- Pestaña de Gestión de Clientes (solo superadmin) -->
  <div *ngIf="activeTab === 'gestion'">
    <app-gestion-clientes></app-gestion-clientes>
  </div>
</div>
