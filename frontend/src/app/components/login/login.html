<!-- Section: Design Block -->
<div class="bg-login" style="height: 100vh; overflow-y: hidden;">
    <br><br><br><br>
    <div *ngIf="!loading" class="container" style="opacity: 0.9;">
        <div class="row justify-content-center">
            <section class="text-center text-lg-start">
                <style>
                .rounded-t-5 {
                    border-top-left-radius: 0.5rem;
                    border-top-right-radius: 0.5rem;
                }
            
                @media (min-width: 992px) {
                    .rounded-tr-lg-0 {
                    border-top-right-radius: 0;
                    }
            
                    .rounded-bl-lg-5 {
                    border-bottom-left-radius: 0.5rem;
                    }
                }
                </style>
                <div class="card mb-3">
                    <div class="row g-0 d-flex align-items-center">
                        <div class="col-lg-4 d-none d-lg-flex">
                            <img src="../../assets/logoMonitoreo.png" alt="logoMonitoreo"
                                class="w-100 rounded-t-5 rounded-tr-lg-0 rounded-bl-lg-5" />
                            </div>
                        <div class="col-lg-6">
                            <div class="card-body py-5 px-md-5">
                    
                                <form (ngSubmit)="login()">
                                <!-- Email input -->
                                <div data-mdb-input-init class="form-outline mb-4">
                                    <input type="email" id="email" class="form-control" [(ngModel)]="email" name="email" required/>
                                    <label class="form-label" for="email">Correo Electronico</label>
                                </div>
                    
                                <!-- Password input -->
                                <div data-mdb-input-init class="form-outline mb-4">
                                    <div class="input-group">
                                        <input [type]="showPassword ? 'text' : 'password'" id="password" class="form-control" [(ngModel)]="password" name="password" required/>
                                        <button (click)="togglePasswordVisibility()" class="btn btn-light border" type="button" id="button-contrato" [title]="!showPassword ? 'Mostrar Contraseña' : 'Ocultar Contraseña'">
                                            <i class="fa-regular fa-eye"></i>
                                        </button>
                                    </div>
                                    <label class="form-label" for="password">Contraseña</label>
                                </div>
                    
                                
                    
                                <!-- Submit button -->
                                <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg">Ingresar</button>
                    
                                </form>
                                <div *ngIf="errorMessage" class="alert alert-danger mt-3">
                                    {{ errorMessage }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>    
    </div>
    <div *ngIf="loading" class="container" style="opacity: 0.9;">
        <div class="card mb-3">
            <div class="justify-content-center alert text-center mt-3 fadeIn animated faster">
                <h4 class="alert-heading">Cargando</h4>
                <p>
                    <i class="fa fa-sync-alt fa-spin fa-3x"></i>
                </p>
                <p>
                    Espere por favor...
                </p>
            </div>
        </div>
    </div>
        
    <div class="centered-logo">
        <img src="https://www.tecnodatasa.cl/wp-content/themes/tecnodata/img/logo.svg" alt>
    </div>
</div>

<!-- Section: Design Block -->
