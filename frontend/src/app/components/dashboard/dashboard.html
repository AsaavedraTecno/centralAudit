<div class="topbar">
  <div class="topbar-content">
    <div class="brand-center">
      <img [src]="logoUrl" alt="Logo" class="logo" [class.hidden]="!logoUrl" (error)="logoUrl=''" />
    </div>

    <button (click)="logout()" class="btn btn-topbar">
      <i class="fas fa-sign-out-alt me-1"></i>
      Cerrar sesión
    </button>
  </div>
  
  <div class="tab-menu">
    <button class="tab-button" [class.active]="activeTab === 'clientes'" (click)="switchTab('clientes')">
      <i class="fas fa-users me-2"></i> Panel
    </button>
    <button class="tab-button" [class.active]="activeTab === 'sucursales'" (click)="switchTab('sucursales')">
      <i class="fas fa-building me-2"></i> Crear Sucursales
    </button>
    <button class="tab-button" [class.active]="activeTab === 'impresoras'" (click)="switchTab('impresoras')">
      <i class="fas fa-print me-2"></i> Impresoras
    </button>
    <button *ngIf="isSuperAdmin()" class="tab-button" [class.active]="activeTab === 'gestion'" (click)="switchTab('gestion')">
      <i class="fas fa-cogs me-2"></i> Gestión Clientes
    </button>
    <button *ngIf="isAdmin()" class="tab-button" [class.active]="activeTab === 'administracion'" (click)="switchTab('administracion')">
      <i class="fas fa-sliders-h me-2"></i> Administración
    </button>
  </div>
</div>

<div class="content-full">
  <div *ngIf="activeTab === 'clientes'"><app-cliente-tree></app-cliente-tree></div>
  <div *ngIf="activeTab === 'sucursales'"><app-sucursales></app-sucursales></div>
  <div *ngIf="activeTab === 'impresoras'"><app-impresoras></app-impresoras></div>
  <div *ngIf="activeTab === 'gestion'"><app-gestion-clientes></app-gestion-clientes></div>

  <div *ngIf="activeTab === 'administracion' && isAdmin()">
    <div class="admin-container">
      <div class="admin-tabs">
        <button class="admin-tab-button" [class.active]="activeAdminTab === 'usuarios'" (click)="switchAdminTab('usuarios')">
          <i class="fas fa-user-tie me-2"></i> Usuarios
        </button>
        <button class="admin-tab-button" [class.active]="activeAdminTab === 'roles'" (click)="switchAdminTab('roles')">
          <i class="fas fa-key me-2"></i> Roles
        </button>
        <button class="admin-tab-button" [class.active]="activeAdminTab === 'audit-logs'" (click)="switchAdminTab('audit-logs')">
          <i class="fas fa-history me-2"></i> Audit Logs
        </button>
      </div>

      <div class="admin-content">
        <div *ngIf="activeAdminTab === 'usuarios'">
          <app-admin-usuarios></app-admin-usuarios>
        </div>

        <div *ngIf="activeAdminTab === 'roles'" class="section-roles">
          <h3><i class="fas fa-key me-2"></i>Gestión de Roles</h3>
        </div>
        <div *ngIf="activeAdminTab === 'audit-logs'" class="section-audit">
          <h3><i class="fas fa-history me-2"></i>Audit Logs</h3>
        </div>
      </div>
    </div>
  </div>
</div>
