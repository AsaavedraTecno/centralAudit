<div class="topbar">
    
    <div class="topbar-content">
        
        <div class="brand-center">
            <img [src]="logoUrl" alt="Logo" class="logo" [class.hidden]="!logoUrl" (error)="logoUrl=''" />
        </div>

        <div class="user-profile-menu dropdown">
            
            <div class="glass-profile" (click)="menuAbierto = !menuAbierto">
                
                <div class="me-3 text-end d-none d-md-block">
                    <span class="d-block fw-bold text-white lh-1 mb-1" style="font-size: 0.9rem;">
                        {{ userName }}
                    </span>
                    <span class="d-block text-white opacity-75 small lh-1" style="font-size: 0.75rem;">
                        {{ getDisplayRole() }}
                    </span>
                </div>
                
                <div class="avatar-glass shadow-sm">
                    {{ userInitial }}
                </div>
                
                <i class="fas fa-chevron-down ms-3 text-white opacity-75 small"></i>
            </div>

            <ul class="dropdown-menu dropdown-menu-end custom-dropdown" [class.show]="menuAbierto">
                
                <li *ngIf="canSeeGlobalAdmin()">
                    <a class="dropdown-item rounded py-2 d-flex align-items-center mb-1" 
                       [routerLink]="['/administracion']" routerLinkActive="active-dropdown"
                       (click)="cerrarMenu()">
                        <div class="icon-box-menu bg-primary-subtle text-primary me-3">
                            <i class="fas fa-sliders-h"></i>
                        </div>
                        <span class="fw-medium">Administración</span>
                    </a>
                </li>
                
                <li><hr class="dropdown-divider my-1 opacity-25"></li>
                
                <li>
                    <a class="dropdown-item rounded py-2 d-flex align-items-center hover-danger" 
                       href="javascript:void(0)" (click)="logout(); cerrarMenu()">
                        <div class="icon-box-menu bg-danger-subtle text-danger me-3">
                            <i class="fas fa-sign-out-alt"></i>
                        </div>
                        <span class="fw-bold text-danger">Cerrar Sesión</span>
                    </a>
                </li>
            </ul>
        </div>
        
    </div> 

    <div class="tab-menu">
        <a [routerLink]="['/monitoreo']" routerLinkActive="active" class="tab-button text-decoration-none">
            <i class="fas fa-desktop me-2"></i> Monitoreo
        </a>

        <a [routerLink]="['/impresoras']" routerLinkActive="active" class="tab-button text-decoration-none">
            <i class="fas fa-print me-2"></i> Impresoras
        </a>

        <a *ngIf="canSeeGlobalAdmin()" [routerLink]="['/gestion-clientes']" routerLinkActive="active" class="tab-button text-decoration-none">
            <i class="fas fa-building me-2"></i> Gestión Clientes
        </a>
    </div>

</div>
<div class="content-full">
    <router-outlet></router-outlet>
</div>

<app-toast></app-toast>
