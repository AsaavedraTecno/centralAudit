<div class="row justify-content-center mt-5 pt-4">
    <div class="col-lg-10">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-3">
            <h5 class="mb-0 fw-bold"><i class="fas fa-list me-2"></i>Clientes en el Sistema</h5>
          </div>
          <span class="badge bg-primary-subtle text-primary">{{ clientes.length }} Registrados</span>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
              <tr>
                <th class="px-4">Empresa / Código</th>
                <th>Ubicación Central</th>
                <th>Alta</th>
                <th>Estado</th>
                <th class="text-end px-4">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let c of clientes">
                <td class="px-4">
                  <div class="fw-bold text-dark">{{ c.nombre }}</div>
                  <small class="text-primary fw-medium">{{ c.rut }}</small>
                </td>
                <td>
                  <div class="small">{{ c.region || 'N/A' }}</div>
                  <div class="text-muted small">{{ c.comuna }}</div>
                </td>
                <td><small class="text-muted">{{ c.created_at | date:'dd/MM/yyyy' }}</small></td>
                <td>
                  <span [class]="getStatusBadge(c.status)">{{ c.status | uppercase }}</span>
                </td>
                <td class="text-end px-4">
                  <div class="btn-group">
                    <button class="btn btn-sm btn-outline-primary" (click)="editarCliente(c.code)" title="Editar Cliente"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-sm btn-outline-info" (click)="crearSucursal(c.code)" title="Agregar Sucursal"><i class="fas fa-building"></i></button>
                    <button class="btn btn-sm btn-outline-danger" (click)="eliminarCliente(c)" title="Eliminar"><i class="fas fa-trash"></i></button>
                  </div>
                </td>
              </tr>
              <tr *ngIf="clientes.length === 0">
                <td colspan="5" class="text-center py-5 text-muted">
                  <i class="fas fa-folder-open fa-2x mb-3 d-block opacity-25"></i>
                  No hay infraestructuras creadas todavía.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
