<div class="split-layout">

  <aside class="tree-sidebar">
    <div class="sidebar-header">
      <h5><i class="fas fa-sitemap me-2 text-primary"></i> Navegación</h5>
    </div>

    <div class="loading-bar-container" *ngIf="cargandoArbol">
      <div class="loading-bar"></div>
    </div>

    <div class="tree-content">
      <div *ngFor="let cliente of clientes" class="tree-node" [style.opacity]="cargandoArbol ? '0.6' : '1'">
        
        <div class="tree-client" (click)="toggleCliente(cliente.code || cliente.id)">
          <i class="fas" [ngClass]="seccionesExpandidas.get(cliente.code || cliente.id) ? 'fa-folder-open text-warning' : 'fa-folder text-warning'"></i>
          <span>{{ cliente.razon_social || cliente.nombre }}</span>
        </div>

        <div class="tree-branches" *ngIf="seccionesExpandidas.get(cliente.code || cliente.id)">
          <div *ngFor="let suc of cliente.sucursales" 
               class="tree-sucursal"
               [ngClass]="{'active': sucursalSeleccionada?.id === suc.id}"
               (click)="seleccionarSucursal(cliente, suc); $event.stopPropagation()">
            <i class="fas fa-map-marker-alt me-2"></i>
            {{ suc.nombre }}
          </div>
        </div>

      </div>

      <div *ngIf="!cargandoArbol && clientes.length === 0" class="p-3 text-center text-muted small">
        No se encontraron clientes.
      </div>
    </div>
  </aside>


  <main class="main-content">

    <ng-container *ngIf="vistaActiva === 'global'">
      <app-resumen-global
        [titulo]="'Resumen Predictivo Global de Impresoras'" 
        [summary]="globalData.summary"
        [locations]="globalData.locations"
        [urgentPrinters]="globalData.urgent"
        [trend]="globalData.trend"
        [lastUpdate]="globalData.lastUpdate"
        [loading]="cargando"
        (printerClicked)="irADetalleUrgente($event)"> </app-resumen-global>
    </ng-container>


    <ng-container *ngIf="vistaActiva === 'sucursal' && sucursalSeleccionada">
      
      <header class="content-header d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="mb-0">{{ sucursalSeleccionada.nombre }}</h2>
          <small class="text-muted">{{ clienteSeleccionado?.razon_social }}</small>
        </div>
        <button class="btn btn-outline-secondary btn-sm" (click)="volverGlobal()">
          ← Volver al Global
        </button>
      </header>

      <div *ngIf="cargando" class="text-center p-5">
        <i class="fas fa-spinner fa-spin fa-3x text-primary"></i>
      </div>

      <ng-container *ngIf="!cargando">
        
        <app-resumen-global
          [titulo]="'Resumen: ' + sucursalSeleccionada.nombre" 
          [summary]="prediccionesSucursal?.summary || null"
          [locations]="[]"
          [urgentPrinters]="impresorasCriticas"
          [trend]="prediccionesSucursal?.trend || []" 
          [loading]="cargando"
          (printerClicked)="verFichaImpresora($event)"> </app-resumen-global>

        <div class="mt-4 mb-3">
          <h4>🖨️ Impresoras en {{ sucursalSeleccionada.nombre }}</h4>
        </div>

        <app-predictive-printer-table
          [printers]="prediccionesSucursal?.printers || []"
          (verDetalles)="verFichaImpresora($event)"> </app-predictive-printer-table>
        
      </ng-container>
    </ng-container>


    <ng-container *ngIf="vistaActiva === 'detalle'">
      <app-prediccion-detalle></app-prediccion-detalle>
    </ng-container>

  </main>
</div>
