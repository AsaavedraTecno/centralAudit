<div class="panel">
  <h4>Tendencia del sistema</h4>

  <div [style.display]="trend && trend.length > 0 ? 'block' : 'none'" style="position: relative; height: 300px; width: 100%;">
    <canvas #trendCanvas></canvas>
  </div>

  <div *ngIf="!trend || trend.length === 0" class="text-center text-muted" style="padding: 40px 0;">
    <i class="fas fa-chart-line fa-2x mb-2" style="opacity: 0.5;"></i>
    <p>No hay datos de tendencia suficientes registrados para esta vista.</p>
  </div>

</div>
