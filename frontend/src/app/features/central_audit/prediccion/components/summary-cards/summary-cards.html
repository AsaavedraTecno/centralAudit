<div class="summary-cards">

  <div class="card total">
    <span>Total</span>
    <strong>{{ summary?.total }}</strong>
  </div>

  <div class="card critical">
    <span>Críticas</span>
    <strong>{{ summary?.critical }}</strong>
  </div>

  <div class="card warning">
    <span>Riesgo</span>
    <strong>{{ summary?.warning }}</strong>
  </div>

  <div class="card ok">
    <span>OK</span>
    <strong>{{ ok }}</strong>
  </div>

</div>
